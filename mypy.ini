[mypy]
python_version = 3.11
# 全局基线：不要求全部注解，但检查函数体、禁止隐式 Optional、清理死 ignore。
# 这几项能抓到真实类型错误，又不会因存量代码缺注解而误报。
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

# core 模块严格：要求完整注解（类型安全是这个项目气质的一部分）。
# 这些模块是纯领域模型/配置，无外部副作用，最先收紧。
[mypy-app.domain.*]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true

[mypy-app.config]
disallow_untyped_defs = true
disallow_incomplete_defs = true

# 第三方库缺类型存根时忽略（不影响业务代码检查）
[mypy-structlog.*]
ignore_missing_imports = true

[mypy-prometheus_client.*]
ignore_missing_imports = true

[mypy-opentelemetry.*]
ignore_missing_imports = true

[mypy-apscheduler.*]
ignore_missing_imports = true

[mypy-asyncpg.*]
ignore_missing_imports = true
