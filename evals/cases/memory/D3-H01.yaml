id: D3-H01
dimension: memory
layer: hard
title: 跨用户隔离：用户 B 的召回不含用户 A 的记忆
path: messages

# 用户 A 在自己的会话里写入一条 A 专属记忆；用户 B（同租户、不同 external_user）
# 另开会话去问一个会命中 A 记忆关键词的问题。同租户不隔离会话是产品决策，
# 本题测的是 external_user 级隔离：scope_key 不同，B 就召回不到 A。
external_user: eval-D3-H01-userB
seed:
  - external_user: eval-D3-H01-userA
    content: "记住 [[tool:remember content=用户A偏好夜间模式,kind=preference]]"

input:
  content: "我的界面偏好是什么"

expect:
  http_status: 200
  stop_reason: completed
  # 被测轮是纯文本问句，不该触发任何工具。
  max_tool_calls: 0
  # 非平凡性前提：A 确实写过——否则「B 的 prompt 不含 A 记忆」会因为压根没东西
  # 可泄漏而假绿。先钉 seed scope 里有这条，再钉 B 的 prompt 里没有。
  seed_scope_contains: ["用户A偏好夜间模式"]
  # 隔离本身：A 的记忆不得出现在 B 被测轮的 system prompt 里。
  recalled_prompt_excludes: ["夜间模式", "用户A"]

note: >-
  设计 §D3-H01。这是安全向的题，最容易写成假绿：如果只断言「B 的 prompt 不含
  A 的内容」，那么 seed 写入失败、召回为空、甚至记忆整个没启用，都会让它通过。
  所以 seed_scope_contains 先把「A 的记忆确实存在于 A 的 scope」钉成前提，
  recalled_prompt_excludes 再证明它没漏进 B。两条合起来才是真正的隔离断言。
  两个会话同属 _ANON_TENANT（同租户），隔离完全由 scope_key=external_user 提供，
  正对应设计里「同租户不隔离会话、但按 external_user 隔离记忆」的产品语义。
  反证方式（验证断言有牙）：把 DbMemoryStore.list_by_scope 的 scope_key 过滤去掉、
  只按 tenant 查，B 就会召回到 A 的「夜间模式」→ recalled_prompt_excludes 立刻变红。
